# Раз в 3 часа: пересобрать сайт и zen.xml — статьи, чьё время наступило, уходят в Дзен
name: Build & publish feed
on:
  schedule:
    - cron: "5 */3 * * *"         # раз в 3 часа
  push:
    branches: [main]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install markdown pyyaml pillow
      - run: python pipeline.py build
      - run: cp static/zen_*.html site/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
